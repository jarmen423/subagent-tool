[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursor-subagent"
version = "0.2.0"
description = "Stateful Cursor sub-agent daemon, NATS bus, and Rust gateway for multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "nats-py>=2.9.0",
    "croniter>=6.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
cursor-subagent = "cursor_subagent.cli:app"
cursor-subagentd = "cursor_subagent.daemon_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_subagent"]

[tool.hatch.build.targets.wheel.sources]
"src/cursor_subagent" = "cursor_subagent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests requiring live NATS, gateway, or CURSOR_API_KEY",
]
